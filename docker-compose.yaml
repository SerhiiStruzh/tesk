services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: filestorage
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin       
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set myminio http://minio:9000 minioadmin minioadmin;
        mc mb myminio/bucket --ignore-existing;
        exit 0;
      "

  backend:
    build: ./backend
    restart: unless-stopped             
    volumes:
      - ./backend:/app
      - /app/node_modules         
    environment:
      DATABASE_URL: postgresql://postgres:admin@host.docker.internal:5433/filestorage
      PORT: 3000

      FRONTEND_URL: http://localhost

      FIREBASE_PROJECT_ID: 
      FIREBASE_PRIVATE_KEY: 
      FIREBASE_CLIENT_EMAIL: 

      JWT_ACCESS_SECRET: 8428a72fe37fbbfc3d0b1ba58e4f66ac7c6a9ae0aba3fddc7995c65ea7e8b988
      JWT_REFRESH_SECRET: 8651eb9ba56eb3f919dd247466680555a540fc2a8d1d0b9bd02c134b8272e781
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d

      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: false
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: bucket
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped            
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      REACT_APP_FIREBASE_API_KEY: 
      REACT_APP_FIREBASE_AUTH_DOMAIN:
      REACT_APP_FIREBASE_PROJECT_ID: 
      REACT_APP_FIREBASE_STORAGE_BUCKET: 
      REACT_APP_FIREBASE_MESSAGING_SENDER_ID: 
      REACT_APP_FIREBASE_APP_ID: 
      REACT_APP_FIREBASE_MEASUREMENT_ID: 

      REACT_APP_BACKEND_URL: /api
    stdin_open: true
    tty: true
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"          
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  minio_data: